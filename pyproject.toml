[project]
name = "loraport"
version = "0.1.2"
description = "Convert LoRA adapters between MLX (mlx-lm) and PEFT formats and prove the weight delta (dW) survived the trip."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["lora", "mlx", "mlx-lm", "peft", "safetensors", "adapter", "vllm", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.8.0",
]

[project.optional-dependencies]
peft = [
    "peft==0.21.2",
    "torch==2.15.0",
    "transformers==5.22.2",
]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/loraport"
Issues = "https://github.com/LeeGyeongPil/loraport/issues"

[project.scripts]
loraport = "loraport.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loraport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "peft: needs the optional `peft` extra (torch, transformers, peft)",
    "mlx: needs mlx-lm and a Metal device (macOS, outside sandboxes)",
]
